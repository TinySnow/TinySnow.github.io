<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1040" viewBox="0 0 1740 1040" role="img" aria-labelledby="title desc">
  <title id="title">半加器：两个输入，两个输出</title>
  <desc id="desc">输入 A 与 B 同时进入异或门和与门，分别得到和 Sum 与进位 Carry；右侧列出四种输入组合。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#e9f1fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17355d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { fill: #102a43; font: 700 48px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #627d98; font: 400 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { fill: #4776aa; font: 700 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      .label { fill: #102a43; font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .small { fill: #627d98; font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { fill: #102a43; font: 700 22px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .table-head { fill: #344e68; font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .table-cell { fill: #102a43; font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1740" height="1040" fill="url(#background)"/>
  <path d="M0 885 C290 800 540 970 870 890 S1440 805 1740 895 V1040 H0 Z" fill="#dfeaf7"/>
  <circle cx="1600" cy="110" r="130" fill="#d9e9f8"/>
  <circle cx="1690" cy="54" r="48" fill="#c4dbf2"/>

  <text x="90" y="92" class="eyebrow">COMPUTER SCIENCE GUIDE / LOGIC CIRCUITS</text>
  <text x="90" y="156" class="title">半加器：两个输入，两个输出</text>
  <text x="90" y="198" class="subtitle">同一对二进制输入，同时回答“和是多少”与“有没有进位”两个问题。</text>

  <g filter="url(#shadow)">
    <rect x="90" y="254" width="1080" height="620" rx="30" fill="#ffffff"/>
    <rect x="1210" y="254" width="440" height="620" rx="30" fill="#ffffff"/>
  </g>

  <text x="138" y="312" class="eyebrow">CIRCUIT FLOW</text>
  <text x="1258" y="312" class="eyebrow">TRUTH TABLE</text>

  <g>
    <rect x="138" y="370" width="230" height="92" rx="18" fill="#e9f3ff" stroke="#9fc3e5" stroke-width="2"/>
    <text x="168" y="408" class="label">输入 A</text>
    <text x="168" y="438" class="small">一个二进制位：0 或 1</text>

    <rect x="138" y="616" width="230" height="92" rx="18" fill="#e9f3ff" stroke="#9fc3e5" stroke-width="2"/>
    <text x="168" y="654" class="label">输入 B</text>
    <text x="168" y="684" class="small">一个二进制位：0 或 1</text>
  </g>

  <g fill="none" stroke="#7b99ba" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M368 416 H446 V447 H514"/>
    <path d="M368 662 H446 V513 H514"/>
    <path d="M368 416 H418 V651 H514"/>
    <path d="M368 662 H446 V717 H514"/>
  </g>
  <circle cx="446" cy="447" r="7" fill="#7b99ba"/>
  <circle cx="446" cy="513" r="7" fill="#7b99ba"/>
  <circle cx="418" cy="651" r="7" fill="#7b99ba"/>
  <circle cx="446" cy="717" r="7" fill="#7b99ba"/>

  <g filter="url(#shadow)">
    <path d="M514 398 H630 C696 398 730 430 752 480 C730 530 696 562 630 562 H514 C535 520 535 440 514 398 Z" fill="#eaf5ff" stroke="#3478c5" stroke-width="4"/>
    <path d="M497 398 C518 440 518 520 497 562" fill="none" stroke="#3478c5" stroke-width="4"/>
    <text x="622" y="466" text-anchor="middle" fill="#1f5e9f" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">异或门</text>
    <text x="622" y="498" text-anchor="middle" fill="#3478c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">XOR</text>

    <path d="M514 606 H630 C696 606 730 638 752 688 C730 738 696 770 630 770 H514 C535 728 535 648 514 606 Z" fill="#fff5df" stroke="#d99722" stroke-width="4"/>
    <text x="622" y="674" text-anchor="middle" fill="#a3670c" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">与门</text>
    <text x="622" y="706" text-anchor="middle" fill="#d99722" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">AND</text>
  </g>

  <path d="M752 480 H820" fill="none" stroke="#3478c5" stroke-width="7" stroke-linecap="round"/>
  <path d="M752 688 H820" fill="none" stroke="#d99722" stroke-width="7" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="820" y="423" width="290" height="114" rx="20" fill="#f3f8ff" stroke="#3478c5" stroke-width="3"/>
    <text x="850" y="465" class="label">和（Sum）</text>
    <text x="850" y="503" fill="#3478c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">Sum = A ⊕ B</text>

    <rect x="820" y="631" width="290" height="114" rx="20" fill="#fff9ec" stroke="#d99722" stroke-width="3"/>
    <text x="850" y="673" class="label">进位（Carry）</text>
    <text x="850" y="711" fill="#b87510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">Carry = A · B</text>
  </g>

  <text x="138" y="824" class="small">异或门负责“和”，与门负责“进位”。半加器不处理来自更低位的进位。</text>

  <g transform="translate(1258 360)">
    <rect width="344" height="58" rx="12" fill="#eaf2fb"/>
    <text x="46" y="37" text-anchor="middle" class="table-head">A</text>
    <text x="112" y="37" text-anchor="middle" class="table-head">B</text>
    <text x="202" y="37" text-anchor="middle" class="table-head">Sum</text>
    <text x="294" y="37" text-anchor="middle" class="table-head">Carry</text>
    <g fill="#ffffff" stroke="#dce7f4" stroke-width="2">
      <rect y="58" width="344" height="58"/>
      <rect y="116" width="344" height="58"/>
      <rect y="174" width="344" height="58"/>
      <rect y="232" width="344" height="58"/>
    </g>
    <g class="table-cell" text-anchor="middle">
      <text x="46" y="95">0</text><text x="112" y="95">0</text><text x="202" y="95">0</text><text x="294" y="95">0</text>
      <text x="46" y="153">0</text><text x="112" y="153">1</text><text x="202" y="153">1</text><text x="294" y="153">0</text>
      <text x="46" y="211">1</text><text x="112" y="211">0</text><text x="202" y="211">1</text><text x="294" y="211">0</text>
    </g>
    <rect y="232" width="344" height="58" fill="#fff0cb" stroke="#e9bc64" stroke-width="2"/>
    <g fill="#86520a" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
      <text x="46" y="269">1</text><text x="112" y="269">1</text><text x="202" y="269">0</text><text x="294" y="269">1</text>
    </g>
  </g>

  <g transform="translate(1258 706)">
    <circle cx="8" cy="0" r="6" fill="#3478c5"/>
    <text x="28" y="6" class="small">输入不同，Sum 为 1</text>
    <circle cx="8" cy="39" r="6" fill="#d99722"/>
    <text x="28" y="45" class="small">两个输入都是 1，Carry 为 1</text>
  </g>
</svg>
