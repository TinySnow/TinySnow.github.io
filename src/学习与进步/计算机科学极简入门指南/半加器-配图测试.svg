<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">半加器：两个输入，两条结果</title>
  <desc id="desc">A 和 B 同时送入异或门与与门，分别得到和 Sum 与进位 Carry。</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17355d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { fill: #102a43; font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #627d98; font: 400 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { fill: #4776aa; font: 700 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      .label { fill: #102a43; font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .small { fill: #627d98; font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .gate { fill: #ffffff; stroke: #bed0e5; stroke-width: 3; }
      .wire { fill: none; stroke: #7b99ba; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .wire-blue { fill: none; stroke: #3478c5; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .wire-gold { fill: none; stroke: #d99722; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .mono { fill: #102a43; font: 700 20px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .table { fill: #344e68; font: 600 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .table-strong { fill: #102a43; font: 700 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 748 C310 666 440 844 760 762 S1240 676 1600 756 V900 H0 Z" fill="#e3edf9"/>
  <circle cx="1450" cy="112" r="112" fill="#dceafa" opacity="0.72"/>
  <circle cx="1510" cy="52" r="42" fill="#c7dcf3" opacity="0.8"/>

  <text x="118" y="112" class="eyebrow">COMPUTER SCIENCE GUIDE / LOGIC CIRCUITS</text>
  <text x="118" y="172" class="title">半加器：两个输入，两条结果</text>
  <text x="118" y="212" class="subtitle">把 A 和 B 同时送进两个逻辑门，分别得到和与进位。</text>

  <g filter="url(#shadow)">
    <rect x="112" y="290" width="916" height="398" rx="28" fill="#ffffff"/>
  </g>
  <text x="158" y="344" class="eyebrow">ONE-BIT ADDITION</text>

  <g>
    <rect x="158" y="390" width="148" height="64" rx="18" fill="#e7f1fc" stroke="#96bce2" stroke-width="2"/>
    <text x="191" y="430" class="label">输入 A</text>
    <text x="266" y="430" class="mono">0 / 1</text>
    <rect x="158" y="535" width="148" height="64" rx="18" fill="#e7f1fc" stroke="#96bce2" stroke-width="2"/>
    <text x="191" y="575" class="label">输入 B</text>
    <text x="266" y="575" class="mono">0 / 1</text>
  </g>

  <path class="wire" d="M306 422 H388 V462 H462"/>
  <path class="wire" d="M306 567 H388 V494 H462"/>
  <path class="wire" d="M306 422 H360 V587 H462"/>
  <path class="wire" d="M306 567 H388 V619 H462"/>
  <circle cx="388" cy="462" r="7" fill="#7b99ba"/>
  <circle cx="388" cy="494" r="7" fill="#7b99ba"/>
  <circle cx="360" cy="587" r="7" fill="#7b99ba"/>
  <circle cx="388" cy="619" r="7" fill="#7b99ba"/>

  <g filter="url(#shadow)">
    <path d="M462 410 H570 C646 410 691 448 715 478 C691 508 646 546 570 546 H462 C486 512 486 444 462 410 Z" fill="#e9f4ff" stroke="#3478c5" stroke-width="4"/>
    <path d="M444 410 C468 448 468 508 444 546" fill="none" stroke="#3478c5" stroke-width="4"/>
    <text x="554" y="467" text-anchor="middle" fill="#1f5e9f" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">异或门</text>
    <text x="554" y="498" text-anchor="middle" fill="#3478c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">XOR</text>

    <path d="M462 568 H570 C651 568 696 604 716 639 C696 674 651 710 570 710 H462 C486 675 486 603 462 568 Z" fill="#fff4dd" stroke="#d99722" stroke-width="4"/>
    <text x="554" y="629" text-anchor="middle" fill="#a3670c" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">与门</text>
    <text x="554" y="660" text-anchor="middle" fill="#d99722" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">AND</text>
  </g>

  <path class="wire-blue" d="M715 478 H786"/>
  <path class="wire-gold" d="M716 639 H786"/>
  <g filter="url(#shadow)">
    <rect x="786" y="433" width="194" height="90" rx="20" fill="#f2f8ff" stroke="#3478c5" stroke-width="3"/>
    <text x="814" y="471" class="label">和</text>
    <text x="854" y="471" fill="#3478c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">Sum</text>
    <text x="814" y="502" class="small">A ⊕ B</text>

    <rect x="786" y="594" width="194" height="90" rx="20" fill="#fff9ec" stroke="#d99722" stroke-width="3"/>
    <text x="814" y="632" class="label">进位</text>
    <text x="883" y="632" fill="#b87510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">Carry</text>
    <text x="814" y="663" class="small">A · B</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="290" width="380" height="398" rx="28" fill="#ffffff"/>
  </g>
  <text x="1128" y="344" class="eyebrow">TRUTH TABLE</text>
  <text x="1128" y="386" class="label">1 + 1 = 10₂</text>

  <g transform="translate(1128 422)">
    <rect width="284" height="50" rx="12" fill="#eaf2fb"/>
    <text x="32" y="31" class="table">A</text>
    <text x="90" y="31" class="table">B</text>
    <text x="142" y="31" class="table">Sum</text>
    <text x="219" y="31" class="table">Carry</text>
    <g fill="#ffffff" stroke="#dce7f4" stroke-width="2">
      <rect y="50" width="284" height="44"/>
      <rect y="94" width="284" height="44"/>
      <rect y="138" width="284" height="44"/>
      <rect y="182" width="284" height="44"/>
    </g>
    <g class="table-strong" text-anchor="middle">
      <text x="38" y="79">0</text><text x="96" y="79">0</text><text x="162" y="79">0</text><text x="244" y="79">0</text>
      <text x="38" y="123">0</text><text x="96" y="123">1</text><text x="162" y="123">1</text><text x="244" y="123">0</text>
      <text x="38" y="167">1</text><text x="96" y="167">0</text><text x="162" y="167">1</text><text x="244" y="167">0</text>
    </g>
    <rect y="182" width="284" height="44" fill="#fff1cd" stroke="#e9bc64" stroke-width="2"/>
    <g fill="#86520a" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
      <text x="38" y="211">1</text><text x="96" y="211">1</text><text x="162" y="211">0</text><text x="244" y="211">1</text>
    </g>
  </g>

  <g transform="translate(1128 630)">
    <circle cx="8" cy="0" r="6" fill="#3478c5"/>
    <text x="26" y="6" class="small">异或门：输入不同，和为 1</text>
    <circle cx="8" cy="34" r="6" fill="#d99722"/>
    <text x="26" y="40" class="small">与门：两个输入都是 1，进位为 1</text>
  </g>

  <text x="118" y="802" fill="#4776aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">A + B = (A ⊕ B) + 2(A · B)</text>
  <text x="118" y="838" class="subtitle">最简单的加法器，只处理两个一位输入，不处理来自低位的进位。</text>
</svg>
